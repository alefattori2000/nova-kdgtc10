<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--ac:#c8102e;--bd:#e3e5ea;--chip:#eef0f4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b22;--tx:#eceef2;--mu:#9aa3b2;--bd:#2a2f3a;--chip:#252a35}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b22;--tx:#eceef2;--mu:#9aa3b2;--bd:#2a2f3a;--chip:#252a35}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h3{font-size:15px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.mu{color:var(--mu);font-size:13px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
textarea{resize:vertical}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:8px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.rec{background:#111;color:#fff}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}.tabs .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:3px 10px;margin:2px 4px 2px 0;font-size:13px}
.chip b{cursor:pointer;margin-left:6px;color:var(--mu)}
.item{cursor:pointer}.g{width:100%;max-width:260px;display:block;margin:0 auto}.gs{width:70px;flex:none}
.rep p{margin:6px 0}.rep ul{margin:6px 0;padding-left:20px}
.over{color:var(--ac)}.done{text-decoration:line-through;color:var(--mu)}
label{font-size:13px;color:var(--mu)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:5}
#app.wide{max-width:1240px}.two{display:grid;grid-template-columns:minmax(320px,2fr) 3fr;gap:16px;align-items:start}.pane{min-width:0;max-height:calc(100vh - 28px);overflow-y:auto;padding-right:2px}.two .backbtn{display:none}
.big{padding:14px 16px;font-size:16px;flex:1 1 45%}
.scn{margin-top:8px}.scncv{width:100%;height:176px;display:block;border-radius:12px;background:radial-gradient(120% 140% at 50% 0%,#0b1c2b,#02090f);margin:6px 0}.scncv.sm{height:120px}
.tl{margin:8px 0 4px;padding-left:6px}.tl-h{font-weight:700;text-transform:capitalize;margin-bottom:6px}
.tl-i{position:relative;display:flex;gap:10px;align-items:flex-start;padding:6px 8px 6px 16px;border-left:2px solid #5ee7ff66;animation:tlin .9s both;animation-delay:var(--d,0s)}
.tl-i.past{opacity:.45}.tl-i.nx{border-left-color:#5ee7ff}.tl-i.live{border-left-color:#ffd27a}
.tl-dot{position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:#5ee7ff;box-shadow:0 0 10px #5ee7ff}.tl-i.live .tl-dot{background:#ffd27a;box-shadow:0 0 10px #ffd27a}
.tl-t{font:700 15px ui-monospace,Menlo,monospace;min-width:48px}
.tl-g{margin-left:0;padding:3px 0 3px 16px;border-left:2px dashed #5ee7ff44;color:var(--mu);font-size:12px;animation:tlin .9s both;animation-delay:var(--d,0s)}.tl-w{font-size:13px;margin-left:6px}
@keyframes tlin{from{opacity:0;transform:translateY(10px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes gpulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
#ent{position:fixed;inset:0;z-index:18;background:#02090f;color:#d7fbff;font-family:system-ui,sans-serif;overflow:hidden}
#ent-orb{position:absolute;inset:0;width:100%;height:100%;display:block}
#ent-cv.scncv{position:absolute;left:0;right:0;top:78px;width:100%;height:27%;background:transparent;margin:0;border-radius:0;pointer-events:none}
#ent-top{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#ent-clock{font:200 40px/1 ui-monospace,Menlo,monospace;letter-spacing:.05em;text-shadow:0 0 18px #5ee7ff88}#ent-date{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#7fd8ee;margin-top:4px}
#ent-bat{font:600 14px ui-monospace,Menlo,monospace;color:#5ee7ff;border:1px solid #5ee7ff66;border-radius:14px;padding:5px 11px;background:#02121c99}
#ent-bat.low{color:#ff9f1a;border-color:#ff9f1a;box-shadow:0 0 14px #ff9f1a88;animation:bpulse 1.4s ease-in-out infinite}#ent-bat.na{color:#6e8794;border-color:#6e879455}
@keyframes bpulse{50%{opacity:.55}}
#ent-sub{position:absolute;left:0;right:0;top:calc(78px + 27%);padding:8px 22px;text-align:center;font:400 15px/1.4 system-ui,sans-serif;color:#cdeefa;text-shadow:0 0 10px #000;transition:opacity .8s;pointer-events:none;max-height:92px;overflow:hidden}
#ent-ap{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;width:min(94%,520px);max-height:48%;overflow:auto;display:flex;flex-direction:column;gap:8px}
.ent-h{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#7fd8ee;text-align:center;animation:entin .8s both}
.ent-c{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid #5ee7ff55;border-radius:12px;background:rgba(2,18,28,.62);backdrop-filter:blur(6px);box-shadow:0 0 18px #5ee7ff22;animation:entin .9s both;animation-delay:var(--d,0s)}
.ent-c b{font:700 17px ui-monospace,Menlo,monospace;color:#5ee7ff}.ent-c span{display:flex;flex-direction:column;font-weight:600}.ent-c small{font-weight:400;color:#9fc7d6;font-size:12px}
.ent-c.past{opacity:.45}.ent-c.nx{border-color:#5ee7ff;box-shadow:0 0 22px #5ee7ff55}.ent-c.live{border-color:#ffd27a}
.ent-x{align-self:center;background:transparent;border:1px solid #5ee7ff55;color:#7fd8ee;border-radius:14px;padding:5px 14px}
@keyframes entin{from{opacity:0;transform:translateY(14px) scale(.94);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
#ent-bar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
#ent-bar button.on{border-color:#ffd27a;color:#ffd27a;box-shadow:0 0 14px #ffd27a55}#ent-bar button{background:rgba(2,18,28,.75);color:#d7fbff;border:1px solid #5ee7ff77;border-radius:20px;padding:11px 16px;font-size:15px}
#dg,#aiset{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:14px}.dgb{background:#07131c;color:#d7fbff;border:1px solid #5ee7ff77;border-radius:14px;padding:14px;width:min(100%,560px);max-height:90vh;overflow:auto}#aiset input{width:100%;margin:4px 0}.dgb pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;max-height:50vh;overflow:auto;margin:8px 0}.dgb button{background:#0d2736;color:#d7fbff;border:1px solid #5ee7ff66;border-radius:10px;padding:8px 10px}
#ent-in{position:absolute;left:0;right:0;bottom:76px;padding:0 14px;gap:8px}#ent-in input{flex:1;background:rgba(2,18,28,.9);color:#d7fbff;border:1px solid #5ee7ff77;border-radius:20px;padding:11px 14px;font-size:16px}#ent-in button{background:#0d2736;color:#d7fbff;border:1px solid #5ee7ff77;border-radius:20px;padding:0 16px}
#gate{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 90% at 50% 40%,#0b2233,#02090f);cursor:pointer;transition:opacity .5s;overflow:hidden}
.gtitle{position:absolute;left:0;right:0;top:15%;text-align:center;font:500 40px/1 Orbitron,system-ui,sans-serif;letter-spacing:.5em;text-indent:.5em;color:#e6fcff;text-shadow:0 0 26px #5ee7ff,0 0 60px #5ee7ff55}

<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const use=async n=>{try{return await window.claude?.use(n)}catch(e){return null}};
const gid=()=>Math.random().toString(36).slice(2,10);
const nowL=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fmt=d=>d?new Date(d).toLocaleString("it-IT",{dateStyle:"medium",timeStyle:"short"}):"";
let P=[],cur=null,view="home",hTab="p",tab="s",mid=null,col=null,sample=null,local=false,armed=false,rec=null,SEL=[],R=null,aiOk=false;
const ST={nofido:["Senza fido","#f59e0b","#1a1d23"],chiuso:["Chiuso / cessato","#ef4444","#fff"]};
const bl=p=>ST[p.stato]?`border-left:5px solid ${ST[p.stato][1]}`:"";
const badge=p=>ST[p.stato]?` <span class="chip" style="background:${ST[p.stato][1]};color:${ST[p.stato][2]}">${ST[p.stato][0]}</span>`:"";
const kids=p=>P.filter(x=>x.parent===p.id);
const desc=p=>{const out=[],q=[p.id];while(q.length){const c=q.pop();P.filter(x=>x.parent===c).forEach(x=>{if(!out.includes(x.id)){out.push(x.id);q.push(x.id)}})}return out};
const grp=p=>{const par=P.find(x=>x.id===p.parent),k=kids(p).length;return par?`<div class="mu">Gruppo: ${esc(par.ragione)}</div>`:k?`<div class="mu">Capogruppo · ${k} società</div>`:""};
const alertBar=p=>ST[p.stato]?`<div class="card" style="background:${ST[p.stato][1]};color:${ST[p.stato][2]};border:0"><b>⚠ ${p.stato==="chiuso"?"Partner chiuso o cessato":"Partner senza fido"}</b>${p.statoDal?" · dal "+new Date(p.statoDal).toLocaleDateString("it-IT"):""}<div style="font-size:13px">Le informazioni restano consultabili.</div></div>`:"";
const groupBox=p=>{const par=P.find(x=>x.id===p.parent),k=kids(p);const lnk=x=>`<span class="chip item" data-a="open" data-id="${x.id}" style="${bl(x)}">${esc(x.ragione)}${ST[x.stato]?" ⚠":""}</span>`;return par||k.length?`<div class="mu" style="margin:6px 0">${par?"Capogruppo: "+lnk(par)+"<br>":""}${k.length?"Società del gruppo: "+k.map(lnk).join(""):""}</div>`:""};
function hist(p){const td=nowL().slice(0,10),ev=[...(p.tk||[]).filter(t=>t.done).map(t=>({d:t.doneAt||t.due||"",h:`<div class="card row sp"><label class="row done" style="font-size:15px"><input type="checkbox" style="width:auto" data-a="tog" data-t="${t.id}" checked> ${esc(t.testo)} <span class="mu">${t.doneAt?new Date(t.doneAt).toLocaleDateString("it-IT"):""}</span></label><button data-a="delt" data-t="${t.id}">×</button></div>`})),...(p.mt||[]).filter(m=>m.data&&m.data.slice(0,10)<td).map(m=>({d:m.data,h:`<div class="card item" data-a="open" data-id="${p.id}" data-tab="i" data-mid="${m.id}"><b>${esc(m.titolo)}</b><div class="mu">Incontro · ${fmt(m.data)}${m.report?" · report pronto":""}</div></div>`}))];return`<h3 style="margin-top:16px">Storico</h3>`+(ev.sort((a,b)=>a.d<b.d?1:-1).map(x=>x.h).join("")||`<div class="mu">Nessuna attività passata.</div>`)}
function agPast(){const td=nowL().slice(0,10),ev=[];P.forEach(p=>{(p.mt||[]).forEach(m=>{if(m.data&&m.data.slice(0,10)<td)ev.push({d:m.data,p,tb:"i",m:m.id,h:`<b>${esc(m.titolo)}</b><div class="mu">Incontro · ${fmt(m.data)} · ${esc(p.ragione)}</div>`})});(p.tk||[]).forEach(t=>{if(t.done)ev.push({d:t.doneAt||t.due||"",p,tb:"t",h:`<span class="done">${esc(t.testo)}</span><div class="mu">Attività svolta${t.doneAt?" · "+fmt(t.doneAt):""} · ${esc(p.ragione)}</div>`})})});return`<h3 style="margin-top:16px">Storico (ultimi 20)</h3>`+(ev.sort((a,b)=>a.d<b.d?1:-1).slice(0,20).map(x=>`<div class="card item" data-a="open" data-id="${x.p.id}" data-tab="${x.tb}" data-mid="${x.m||""}">${x.h}</div>`).join("")||`<div class="mu">Nessuna attività passata.</div>`)}
const OPEN={};
const fold=(k,t,n)=>`<div class="row sp item" data-a="fold" data-k="${k}"><h3 style="margin:0">${t} <span class="mu">(${n})</span></h3><span>${OPEN[k]?"▾":"▸"}</span></div>`;
function listCard(p,k,title,ph){return`<div class="card">${fold(k,title,(p[k]||[]).length)}<div style="${OPEN[k]?"":"display:none"}"><div>${(p[k]||[]).map((t,i)=>`<span class="chip">${esc(t)}<b data-a="dellist" data-k="${k}" data-i="${i}">×</b></span>`).join("")||`<span class="mu">Nessuna voce.</span>`}</div><div class="row" style="flex-wrap:nowrap"><input id="in-${k}" placeholder="${ph}"><button data-a="addlist" data-k="${k}">+</button></div></div></div>`}
const prov=p=>p.fonti?.length?`<div class="mu">Dati da ricerca web del ${esc(p.agg||"")}, da verificare: ${p.fonti.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(String(u).split("//").pop().split("/")[0])}</a>`).join(", ")}</div>`:`<div class="mu">Per compilare in automatico dati societari, vendor e utenti finali: scrivi a Claude in chat «compila il partner ${esc(p.ragione)}».</div>`;
async function capGuess(auto){const p=cp();if(!p||!sample)return auto?0:toast("AI non disponibile in questa vista");if(!p.citta&&!p.loc)return auto?0:toast("Inserisci città o località");try{const r=await sample.json(`Indica il CAP italiano per questo indirizzo: via "${p.ind||""}", località/frazione "${p.loc||""}", città "${p.citta||""}". Se la città ha più CAP e la via non basta a sceglierne uno, dà il più probabile con confidenza bassa. Non inventare: se non sei ragionevolmente sicuro, restituisci cap vuoto. Rispondi SOLO con JSON: {"cap":"5 cifre oppure vuoto","confidenza":"alta|media|bassa"}`,{cache:false});aiOk=true;if(/^\d{5}$/.test(r.cap||"")){p.cap=r.cap;persist(p);const i=document.querySelector('[data-f="cap"]');if(i)i.value=r.cap;toast("CAP "+r.cap+" (confidenza "+r.confidenza+"): da verificare")}else if(!auto)toast("CAP non determinabile con sicurezza")}catch(e){if(!auto)toast("Calcolo CAP non riuscito")}}
const wz=p=>"https://waze.com/ul?q="+encodeURIComponent([p.ind,p.cap,p.loc,p.citta].filter(Boolean).join(", "))+"&navigate=yes";
const sel=()=>SEL.map(id=>P.find(p=>p.id===id)).filter(Boolean);
const inLunch=t=>!!t&&t>="12:00"&&t<="13:30";
function routePanel(){const s=sel();if(s.length<2)return`<div class="mu">Seleziona 2 o più partner della stessa città (casella a sinistra) per pianificare l’itinerario.</div>`;const day=R?.day||nowL().slice(0,10);return`<div class="card"><h3>Itinerario (${s.length} tappe)</h3><label>Giorno</label><input id="rd" type="date" value="${day}"><label>Partenza da (indirizzo)</label><input id="rs" value="${esc(R?.start||"")}" placeholder="Via, città"><label>Ora di partenza</label><input id="rh" type="time" value="${R?.h||"08:30"}">${s.map(p=>{const m=(p.mt||[]).find(x=>(x.data||"").startsWith(day));const v=R?.t?.[p.id]??(m?m.data.slice(11,16):"");return`<label>${esc(p.ragione)}: ora appuntamento (vuoto = flessibile)</label><input type="time" data-rt="${p.id}" value="${esc(v)}">`}).join("")}<button class="p" data-a="route">Calcola itinerario</button><div id="rout" class="rep">${R?.out||""}</div><button data-a="sayroute">🔊 Leggi itinerario</button></div>`}
async function doRoute(){if(!sample)return toast("AI non disponibile in questa vista");const s=sel();R=R||{t:{}};R.day=$("#rd").value;R.start=$("#rs").value.trim();R.h=$("#rh").value;s.forEach(p=>{R.t[p.id]=document.querySelector(`[data-rt="${p.id}"]`).value});
 const miss=s.filter(p=>!p.ind);if(miss.length)return toast("Manca l’indirizzo di: "+miss.map(p=>p.ragione).join(", "));
 if(new Set(s.map(p=>(p.citta||"").trim().toLowerCase())).size>1)toast("Città diverse: stima meno affidabile");
 const out=$("#rout");out.textContent="Calcolo…";const gs=new Date(R.day+"T12:00").toLocaleDateString("it-IT",{weekday:"long"});
 const pr=`Sei un pianificatore di visite commerciali in auto. Non hai dati di traffico in tempo reale: usa la conoscenza generale della città, degli orari di punta e della viabilità, e considera i tempi come stime. Giorno: ${gs} ${R.day}. Partenza: ${R.start||"non indicata"} alle ${R.h}. Tappe: ${s.map(p=>`id ${p.id} = ${p.ragione}, ${p.ind}, ${p.cap||""} ${p.loc||""}, ${p.citta||""}, appuntamento ${R.t[p.id]||"flessibile"}`).join("; ")}. Obiettivo: ordine di visita che minimizza il tempo in auto, rispetta gli orari fissi e lascia 45 minuti per visita. Se due orari fissi sono incompatibili, o un indirizzo è ambiguo o non conosci la zona, segnalalo negli avvisi. Rispondi SOLO con JSON: {"ordine":["id nell’ordine di visita"],"tratte":[{"verso":"id","minuti":numero,"note":"max 12 parole"}],"orari":[{"id":"id","arrivo":"HH:MM"}],"motivazione":"max 3 frasi sul perché del primo","avvisi":["max 3"]}`;
 try{const r=await sample.json(pr,{cache:false});const by=Object.fromEntries(s.map(p=>[p.id,p]));const ord=(r.ordine||[]).filter(i=>by[i]);
 let h=`<p><b>Ordine consigliato</b></p><ol>`+ord.map(i=>{const p=by[i],t=(r.tratte||[]).find(x=>x.verso===i),a=(r.orari||[]).find(x=>x.id===i);return`<li><b>${esc(p.ragione)}</b>${a?" · arrivo ~"+esc(a.arrivo):""}${R.t[i]?" · appunt. "+esc(R.t[i]):""}<div class="mu">${t?"~"+esc(t.minuti)+" min in auto (stima) · "+esc(t.note||""):""}</div><a href="${wz(p)}" target="_blank" rel="noopener">Naviga con Waze</a></li>`}).join("")+`</ol><p>${esc(r.motivazione)}</p>`+(r.avvisi||[]).map(x=>`<p class="over">⚠ ${esc(x)}</p>`).join("")+`<div class="mu">Tempi stimati dall’AI, senza traffico live: Waze mostra il tempo reale quando avvii la navigazione.</div>`;
 ord.forEach(i=>{const p=by[i],a=(r.orari||[]).find(x=>x.id===i),t=R.t[i]||a?.arrivo;if(inLunch(t))h+=`<div class="card"><b>Pranzo vicino a ${esc(p.ragione)} (${esc(t)})</b><div class="row"><a href="https://www.google.com/maps/search/${encodeURIComponent("ristoranti "+p.ind+" "+(p.citta||""))}" target="_blank" rel="noopener">Google Maps</a><a href="https://www.google.com/search?q=${encodeURIComponent("site:thefork.it ristoranti "+(p.citta||""))}" target="_blank" rel="noopener">TheFork</a></div><div class="mu">Il filtro ≥4/5 e ~20€ a persona non è verificabile da questa pagina: chiedi il confronto a Claude in chat.</div></div>`});
 R.out=h;out.innerHTML=h;if(VOICE)say(out.textContent)}catch(e){out.textContent="Calcolo non riuscito, riprova."}}
const cp=()=>P.find(p=>p.id===cur);
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
function persist(p){const i=P.findIndex(x=>x.id===p.id);if(i<0)P.push(p);else P[i]=p;
 if(col)col.doc(p.id).set(JSON.parse(JSON.stringify(p))).catch(()=>toast("Salvataggio non riuscito"));
 else try{localStorage.setItem("pt",JSON.stringify(P))}catch(e){}}
function gauge(v,sm){const pt=(u,r)=>{const a=Math.PI*(1-u/10);return[100+r*Math.cos(a),100-r*Math.sin(a)]};
 const arc=(f,t,c)=>{const[a,b]=pt(f,85),[x,y]=pt(t,85);return`<path d="M${a} ${b}A85 85 0 0 1 ${x} ${y}" stroke="${c}" stroke-width="14" fill="none"/>`};
 const[nx,ny]=pt(v||0,70);
 return`<svg viewBox="0 0 200 122" class="${sm?"gs":"g"}">${arc(0,3.33,"#ef4444")}${arc(3.33,6.66,"#f59e0b")}${arc(6.66,10,"#22c55e")}${v==null?"":`<line x1="100" y1="100" x2="${nx}" y2="${ny}" stroke="var(--tx)" stroke-width="3" stroke-linecap="round"/>`}<circle cx="100" cy="100" r="6" fill="var(--tx)"/><text x="100" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="var(--tx)">${v==null?"n.d.":v.toFixed(1)}</text></svg>`}
const bold=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function md(t){let h="",ul=false;for(const l of esc(t).split("\n")){const b=/^\s*[-•*]\s+(.*)/.exec(l);
 if(b){if(!ul){h+="<ul>";ul=true}h+="<li>"+bold(b[1])+"</li>"}else{if(ul){h+="</ul>";ul=false}if(l.trim())h+="<p>"+bold(l)+"</p>"}}return h+(ul?"</ul>":"")}

function agBar(){const td=nowL().slice(0,10);if(!OPEN.ag)return`<button class="p" data-a="agnew" style="width:100%;margin-bottom:6px">+ Nuovo appuntamento</button>`;return`<div class="card"><div class="row sp"><h3 style="margin:0">Nuovo appuntamento</h3><button data-a="agnew">Chiudi</button></div><label>Azienda</label><select id="ag-p"><option value="">Scegli il partner…</option>${[...P].sort((a,b)=>String(a.ragione).localeCompare(String(b.ragione))).map(x=>`<option value="${x.id}">${esc(x.ragione)}</option>`).join("")}</select><label>Titolo</label><input id="ag-t" value="Visita commerciale"><label>Giorno</label><input id="ag-d" type="date" value="${td}"><div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label>Dalle</label><input id="ag-s" type="time" value="09:00"></div><div style="flex:1"><label>Alle</label><input id="ag-e" type="time" value="10:00"></div></div><label>Tipo</label><select id="ag-k"><option>Sede Cliente</option><option>Telepresence Microsoft Teams</option><option>Telefonata</option><option>Altro</option></select><button class="p" data-a="agadd">Salva appuntamento</button><div class="mu">Lo trovi poi nella scheda del partner, tab Attività.</div></div>`}
let MODE="auto";try{MODE=localStorage.getItem("vm")||"auto"}catch(e){}
const mq=window.matchMedia?matchMedia("(min-width:900px)"):{matches:false};
const isWide=()=>MODE==="pc"||(MODE==="auto"&&mq.matches);
if(mq.addEventListener)mq.addEventListener("change",()=>render());
let lastCur=null;
let ORIG="";try{ORIG=localStorage.getItem("orig")||""}catch(e){}
let NX=null;
const HM=d=>d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
const remoteT=m=>/teams|telefon|telepresence|call|video/i.test(m.tipo||"");
const tzOff=d=>{const o=-d.getTimezoneOffset(),s=o>=0?"+":"-",a=Math.abs(o);return s+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0")};
const isoL=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,19);
function depInfo(m){const st=new Date(m.data);if(!m.viaggio||isNaN(st))return null;const arr=new Date(st.getTime()-5*6e4),dep=new Date(arr.getTime()-m.viaggio*6e4);return{st,arr,dep}}
function depHTML(m){const i=depInfo(m);if(!i)return`<div class="mu">Inserisci il tempo di viaggio (controllalo su Waze) o usa la stima AI: ti dico a che ora partire.</div>`;const late=i.dep<new Date();return`<p class="${late?"over":""}"><b>${late?"Dovresti essere già partito: ":"Parti alle "}${HM(i.dep)}</b><br><span class="mu">Arrivo previsto ${HM(i.arr)}, 5 minuti prima delle ${HM(i.st)}${m.viaggioAI?" · tempo stimato dall’AI, senza traffico live":""}</span></p>`}
function calLinks(p,m){const i=depInfo(m);if(!i)return"";const subj="Parti per "+p.ragione,body="Appuntamento alle "+HM(i.st)+": "+(m.titolo||"");
 const ol=`https://outlook.office.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&startdt=${encodeURIComponent(isoL(i.dep)+tzOff(i.dep))}&enddt=${encodeURIComponent(isoL(i.arr)+tzOff(i.arr))}&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
 const g=d=>isoL(d).replace(/[-:]/g,"");
 const gc=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(subj)}&dates=${g(i.dep)}/${g(i.arr)}&details=${encodeURIComponent(body)}`;
 return`<div class="row"><a href="${ol}" target="_blank" rel="noopener">Promemoria in Outlook</a><a href="${gc}" target="_blank" rel="noopener">Google Calendar</a></div><div class="mu">Crea un evento di spostamento che inizia all’ora di partenza. L’allarme dipende dalle impostazioni del tuo calendario.</div>`}
function nextCard(){const now=nowL();let best=null;P.forEach(p=>(p.mt||[]).forEach(m=>{if(m.data&&(m.fine||m.data)>=now&&(!best||m.data<best.m.data))best={p,m}}));NX=best?{pid:best.p.id,mid:best.m.id}:null;if(!best)return"";const{p,m}=best,rem=remoteT(m);
 return`<div class="card" style="border-color:var(--ac)"><div class="mu">Prossimo appuntamento</div><b>${esc(m.titolo)}</b> · ${esc(p.ragione)}<div class="mu">${fmt(m.data)}${m.tipo?" · "+esc(m.tipo):""}</div>${refLine(p)}${rem?"":`<label>Parti da</label><input id="nx-o" value="${esc(ORIG)}" placeholder="Indirizzo di partenza"><label>Tempo di viaggio (minuti)</label><div class="row" style="flex-wrap:nowrap"><input id="nx-v" inputmode="numeric" value="${m.viaggio??""}"><button data-a="nxest">Stima AI</button></div><div id="nx-dep">${depHTML(m)}</div><div class="row"><a href="${wz(p)}" target="_blank" rel="noopener">Naviga con Waze</a><button data-a="nxmap">Mappa</button></div><div id="nx-cal">${calLinks(p,m)}</div>`}<div style="margin-top:10px"><b>Ti serve un riassunto su ${esc(p.ragione)} prima di entrare?</b></div><div class="row"><button class="p" data-a="nxbrief">Sì, preparami il briefing</button><button data-a="vbrief">🔊 Leggi ad alta voce</button></div><div class="rep" id="nx-brief">${m.brief?md(m.brief)+`<div class="mu">Briefing del ${new Date(m.briefAt).toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"})}: generato dall’AI sui dati dell’app, da verificare</div>`:""}</div></div>`}
function nxField(el){const p=P.find(x=>x.id===NX?.pid),m=p&&p.mt.find(x=>x.id===NX.mid);if(el.id==="nx-o"){ORIG=el.value.trim();try{localStorage.setItem("orig",ORIG)}catch(e){}return}if(!m)return;const v=parseInt(el.value,10);m.viaggio=v>0?v:null;m.viaggioAI=false;persist(p);$("#nx-dep").innerHTML=depHTML(m);$("#nx-cal").innerHTML=calLinks(p,m)}

/* ===== modalità autonoma (fuori da Claude): AI con chiave propria, dati sul telefono ===== */
const LSg=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},LSs=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const AIP=["https://api.groq.com/openai/v1/chat/completions","openai/gpt-oss-120b"];
function mkSample(){
 const cfg=()=>({url:LSg("ai_url")||AIP[0],key:LSg("ai_key"),model:LSg("ai_model")||AIP[1]});
 const err=(code,msg)=>{const e=new Error(msg);e.code=code;return e};
 async function chat(messages,o,tools,stream){const c=cfg();if(!c.key)throw err("no_key","Manca la chiave AI: apri ⚙︎ Impostazioni");
  const body={model:c.model,messages,stream:!!stream};if(tools&&tools.length)body.tools=tools.map(t=>({type:"function",function:{name:t.name,description:t.description,parameters:t.inputSchema||{type:"object",properties:{}}}}));if(o.json)body.response_format={type:"json_object"};
  let r;try{r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+c.key},body:JSON.stringify(body),signal:o.signal})}catch(e){throw err("network","Rete non raggiungibile ("+(e.message||e)+")")}
  if(!r.ok){let t="";try{t=(await r.text()).slice(0,200)}catch(e){}throw err(r.status===429?"rate_limited":r.status===401?"bad_key":"http_"+r.status,(r.status===429?"Limite gratuito raggiunto, riprova tra poco. ":r.status===401?"Chiave AI non valida. ":"Errore AI "+r.status+". ")+t)}
  if(!stream){const j=await r.json(),m=(j.choices&&j.choices[0]&&j.choices[0].message)||{};return{content:m.content||"",tool_calls:m.tool_calls||[]}}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="",content="",tcs=[];
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(d==="[DONE]")continue;let j;try{j=JSON.parse(d)}catch(e){continue}const dl=j.choices&&j.choices[0]&&j.choices[0].delta;if(!dl)continue;if(dl.content){content+=dl.content;o.onChunk&&o.onChunk(content)}(dl.tool_calls||[]).forEach(tc=>{const k=tc.index||0;tcs[k]=tcs[k]||{id:"",type:"function",function:{name:"",arguments:""}};if(tc.id)tcs[k].id=tc.id;if(tc.function){if(tc.function.name)tcs[k].function.name+=tc.function.name;if(tc.function.arguments)tcs[k].function.arguments+=tc.function.arguments}})}}
  return{content,tool_calls:tcs.filter(Boolean)}}
 const sample=async(prompt,o={})=>{const msgs=[{role:"user",content:String(prompt)}],tools=o.tools||[];let acc="";
  for(let round=0;round<8;round++){const res=await chat(msgs,{signal:o.signal,onChunk:x=>{o.onText&&o.onText({text:acc+x,delta:""})}},tools,true),cur=res.content;
   if(!res.tool_calls.length){acc+=cur;return{text:acc}}
   if(cur)acc+=cur+"\n\n";
   const calls=res.tool_calls.map((t,i)=>({id:t.id||"call_"+round+"_"+i,type:"function",function:t.function}));
   msgs.push({role:"assistant",content:res.content||null,tool_calls:calls});
   for(const t of calls){const def=tools.find(x=>x.name===t.function.name);let out;try{const a=t.function.arguments?JSON.parse(t.function.arguments):{};out=def?await def.execute(a):"strumento sconosciuto"}catch(e){out="errore: "+(e.message||e)}msgs.push({role:"tool",tool_call_id:t.id,content:typeof out==="string"?out:JSON.stringify(out)})}}
  return{text:acc}};
 sample.json=async(prompt,o={})=>{const res=await chat([{role:"user",content:String(prompt)+"\n\nRispondi SOLO con JSON valido."}],{json:true,signal:o.signal},[],false),t=res.content,a=t.indexOf("{"),b=t.lastIndexOf("}");try{return JSON.parse(t.slice(a,b+1))}catch(e){throw err("bad_json","Risposta AI non valida")}};
 sample.limits=async()=>({tools:{maxCount:40}});
 return sample}
if(!window.claude)window.claude={use:async n=>n==="sample"?mkSample():null};
function aiOpen(){let d=$("#aiset");if(d)d.remove();d=document.createElement("div");d.id="aiset";
 d.innerHTML=`<div class="dgb"><b>Impostazioni di Nova</b><div class="mu">Servizio AI compatibile OpenAI (consigliato Groq, gratuito con limiti). La chiave resta solo su questo telefono.</div><label>Indirizzo</label><input id="ai-url" value="${esc(LSg("ai_url")||AIP[0])}"><label>Modello</label><input id="ai-model" value="${esc(LSg("ai_model")||AIP[1])}"><label>Chiave</label><input id="ai-key" type="password" autocomplete="off" value="${esc(LSg("ai_key"))}"><div class="row" style="margin-top:10px"><button data-a="aisave">Salva e prova</button><button data-a="aiexp">Esporta dati</button><button data-a="aiimp">Importa dati</button><button data-a="aix">Chiudi</button></div><input id="ai-imp" type="file" accept=".json,application/json" style="display:none"><div id="ai-st" class="mu" style="margin-top:8px"></div></div>`;document.body.appendChild(d)}

 try{const r=await sample("Rispondi con una sola parola: pronto.");st.textContent="✅ Funziona: «"+r.text.trim().slice(0,60)+"»"}catch(e){st.textContent="❌ "+(e.message||e.code)}}
function aiExport(){const o={app:"nova",v:1,esportato:new Date().toISOString(),partner:P},b=new Blob([JSON.stringify(o)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="nova-dati-"+nowL().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},2000);const st=$("#ai-st");if(st)st.textContent="Dati esportati ("+P.length+" partner)."}
document.addEventListener("change",e=>{if(e.target&&e.target.id==="ai-imp"){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const st=$("#ai-st");try{const o=JSON.parse(rd.result),L=Array.isArray(o)?o:o.partner;if(!Array.isArray(L))throw new Error("formato non riconosciuto");P=L;LSs("pt",JSON.stringify(P));render();if(st)st.textContent="✅ Importati "+L.length+" partner."}catch(x){if(st)st.textContent="❌ "+x.message}};rd.readAsText(f)}});
(async()=>{
 render();enterGate();
 const u=await use("user"),id=u?await u.id().catch(()=>null):null,db=await use("db");
 if(db&&id){col=db.collection("data/users/"+id);
  col.onSnapshot(s=>{P=s.docs.map(x=>x.data());if(!window._wxi){window._wxi=1;setTimeout(()=>wxLoad(false),300)}const t=document.activeElement?.tagName;if(!/INPUT|TEXTAREA|SELECT/.test(t))render()},()=>{});}
 else{local=true;try{P=JSON.parse(localStorage.getItem("pt")||"[]")}catch(e){}render();setTimeout(()=>wxLoad(false),300)}

})();
